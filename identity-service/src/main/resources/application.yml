spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${IDENTITY_DB:userDB}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${IDENTITY_PORT:8081}

novelforge:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

identity:
  internal:
    client-secret: ${IDENTITY_INTERNAL_CLIENT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}