spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/userDB
    username: postgres
    password: 365891
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  sql:
    init:
      mode: always
server:
  port: 8081
  servlet:
    context-path: /api/v1/identity
jwt:
  secretKey: wdergrgrgthththtynjrtbhrtgbtrffrfttrgfgg
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}