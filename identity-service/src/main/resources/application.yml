spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:5432/userDB
    username: postgres
    password: ${DB_PASSWORD:365891}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      url:

server:
  port: 8081

jwt:
  secretKey: ${JWT_SECRET_KEY:local-dev-secret-key-change-before-production}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

notification:
  service:
    url: http://localhost:8082