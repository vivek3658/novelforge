server:
  port: ${PORT:8081}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    accept-count: 50
    max-connections: 100

spring:
  application:
    name: identity-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://novelforge-postgres:5432/userDB}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1500000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  data:
    redis:
      url: ${REDIS_URL:}
      host: ${SPRING_DATA_REDIS_HOST:novelforge-redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:default}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 4
          max-idle: 2
          min-idle: 1
          max-wait: 5000ms

  rabbitmq:
    addresses: ${RABBITMQ_URL:${SPRING_RABBITMQ_ADDRESSES:}}
    host: ${RABBITMQ_HOST:novelforge-rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:novelforge}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 5000ms
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: 1
        max-concurrency: 2
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2
          max-interval: 10000ms

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

identity:
  cookies:
    secure: ${COOKIE_SECURE:true}

imagekit:
  private-key: ${IMAGEKIT_PRIVATE_KEY:}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://novelforge-eureka-server:8761/eureka/}
    registry-fetch-interval-seconds: 15
  instance:
    hostname: ${RENDER_EXTERNAL_HOSTNAME:${RENDER_SERVICE_NAME:localhost}}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
