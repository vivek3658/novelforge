networks:
  novelforge-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:

services:
  # -------------------------------------------------------------
  # Infrastructure Services
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: novelforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    networks:
      - novelforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: novelforge-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-novelforge}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - novelforge-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: novelforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novelforge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: novelforge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-novelforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - novelforge-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: novelforge-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - novelforge-network

  # -------------------------------------------------------------
  # Service Discovery
  # -------------------------------------------------------------
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: novelforge/eureka-server:latest
    container_name: eureka-server
    restart: unless-stopped
    expose:
      - "8761"
    networks:
      - novelforge-network

  # -------------------------------------------------------------
  # API Gateway
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: novelforge/api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?Set GATEWAY_INTERNAL_SECRET in .env}
      GATEWAY_TRUSTED_PROXY_HOPS: ${GATEWAY_TRUSTED_PROXY_HOPS:-0}
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - novelforge-network

  # -------------------------------------------------------------
  # Identity Service
  # -------------------------------------------------------------
  identity-service:
    build:
      context: .
      dockerfile: ./identity-service/Dockerfile
    image: novelforge/identity-service:latest
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NOVELFORGE_SECURITY_JWT_SECRET_KEY: ${NOVELFORGE_SECURITY_JWT_SECRET_KEY:-${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?Set OTP_HMAC_SECRET in .env}
      IDENTITY_INTERNAL_CLIENT_SECRET: ${IDENTITY_INTERNAL_CLIENT_SECRET:?Set IDENTITY_INTERNAL_CLIENT_SECRET in .env}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?Set GATEWAY_INTERNAL_SECRET in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-novelforge}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - novelforge-network

  # -------------------------------------------------------------
  # Notification Service
  # -------------------------------------------------------------
  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    image: novelforge/notification-service:latest
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-novelforge}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      IDENTITY_INTERNAL_CLIENT_SECRET: ${IDENTITY_INTERNAL_CLIENT_SECRET:?Set IDENTITY_INTERNAL_CLIENT_SECRET in .env}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-smtp}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-notifications@novelforge.local}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - novelforge-network

  # -------------------------------------------------------------
  # Novel Service
  # -------------------------------------------------------------
  studio-service:
    build:
      context: .
      dockerfile: ./studio-service/Dockerfile
    image: novelforge/studio-service:latest
    container_name: studio-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studioDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      IDENTITY_SERVICE_BASE_URL: http://identity-service:8081
      IDENTITY_INTERNAL_CLIENT_SECRET: ${IDENTITY_INTERNAL_CLIENT_SECRET:?Set IDENTITY_INTERNAL_CLIENT_SECRET in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      identity-service:
        condition: service_started
    networks:
      - novelforge-network

  novel-service:
    build:
      context: .
      dockerfile: ./novel-service/Dockerfile
    image: novelforge/novel-service:latest
    container_name: novel-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/novelDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_MONGODB_URI: mongodb://${MONGODB_USERNAME:-novelforge}:${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}@mongodb:27017/novelforge_chapters?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      NOVELFORGE_SECURITY_JWT_SECRET_KEY: ${NOVELFORGE_SECURITY_JWT_SECRET_KEY:-${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      STUDIO_SERVICE_BASE_URL: http://studio-service:8087
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      studio-service:
        condition: service_started
    networks:
      - novelforge-network

  # -------------------------------------------------------------
  # Engagement Service
  # -------------------------------------------------------------
  engagement-service:
    build:
      context: ./engagement-service
      dockerfile: Dockerfile
    image: novelforge/engagement-service:latest
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      - eureka-server
    networks:
      - novelforge-network

  # -------------------------------------------------------------
  # AI Service
  # -------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: novelforge/ai-service:latest
    container_name: ai-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      - eureka-server
    networks:
      - novelforge-network

  # -------------------------------------------------------------
  # Analytics Service
  # -------------------------------------------------------------
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    image: novelforge/analytics-service:latest
    container_name: analytics-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      - eureka-server
    networks:
      - novelforge-network

  # -------------------------------------------------------------
  # Frontend Client
  # -------------------------------------------------------------
  novelforge-client:
    build:
      context: ./novelforge-client
      dockerfile: Dockerfile
    image: novelforge/novelforge-client:latest
    container_name: novelforge-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - novelforge-network
