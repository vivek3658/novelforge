spring:
  datasource:
    url: jdbc:h2:mem:studio_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
eureka:
  client:
    enabled: false
novelforge:
  security:
    jwt:
      secret-key: test-secret-key-with-more-than-32-bytes-for-jwt-testing
identity:
  service:
    base-url: http://localhost:8081
    client-secret: test-internal-secret
