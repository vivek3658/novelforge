server:
  port: ${PORT:8087}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    accept-count: 50
    max-connections: 100

spring:
  application:
    name: studio-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://novelforge-postgres:5432/studioDB}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1500000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:novelforge-redis}}
      port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      timeout: 3000ms

novelforge:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

identity:
  service:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://novelforge-identity-service:8081}
    client-secret: ${STUDIO_IDENTITY_INTERNAL_SECRET:}

studio:
  internal:
    novel-client-secret: ${NOVEL_STUDIO_INTERNAL_SECRET:}
    engagement-client-secret: ${ENGAGEMENT_STUDIO_INTERNAL_SECRET:}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://novelforge-eureka-server:8761/eureka/}}
    registry-fetch-interval-seconds: 15
  instance:
    hostname: ${RENDER_EXTERNAL_HOSTNAME:${RENDER_SERVICE_NAME:localhost}}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
