spring:
  application:
    name: studio-service

  datasource:
    url: jdbc:postgresql://localhost:5432/userDB
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:365891}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${STUDIO_PORT:8087}

novelforge:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

identity:
  service:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
    client-secret: ${IDENTITY_INTERNAL_CLIENT_SECRET:qwertyuioooopasdfghjkl}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}