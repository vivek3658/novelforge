spring:
  datasource:
    url: jdbc:h2:mem:engagement;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: simple
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
eureka:
  client:
    enabled: false
