spring:
  application:
    name: engagement-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/engagementDB}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 30s
      cache-null-values: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
server:
  port: ${SERVER_PORT:8084}
novelforge:
  security:
    jwt:
      secret-key: ${NOVELFORGE_SECURITY_JWT_SECRET_KEY:${JWT_SECRET_KEY:}}
  engagement:
    feed:
      high-follower-threshold: ${ENGAGEMENT_HIGH_FOLLOWER_THRESHOLD:10000}
      fanout-queue: ${ENGAGEMENT_FANOUT_QUEUE:engagement.feed.fanout}
  internal:
    studio-client-secret: ${ENGAGEMENT_STUDIO_INTERNAL_SECRET:}
    identity-client-secret: ${ENGAGEMENT_IDENTITY_INTERNAL_SECRET:}
services:
  studio:
    base-url: ${STUDIO_SERVICE_BASE_URL:http://localhost:8087}
  identity:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
  novel:
    base-url: ${NOVEL_SERVICE_BASE_URL:http://localhost:8083}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
