server:
  port: ${PORT:8084}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    accept-count: 50
    max-connections: 100

spring:
  application:
    name: engagement-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://novelforge-postgres:5432/engagementDB}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1500000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  data:
    redis:
      url: ${REDIS_URL:}
      host: ${SPRING_DATA_REDIS_HOST:novelforge-redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms

  cache:
    type: redis
    redis:
      time-to-live: 60s
      cache-null-values: false

  rabbitmq:
    addresses: ${RABBITMQ_URL:${SPRING_RABBITMQ_ADDRESSES:}}
    host: ${RABBITMQ_HOST:novelforge-rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:novelforge}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 5000ms
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: 1
        max-concurrency: 2
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2
          max-interval: 10000ms

novelforge:
  security:
    jwt:
      secret-key: ${NOVELFORGE_SECURITY_JWT_SECRET_KEY:${JWT_SECRET_KEY:}}
  engagement:
    feed:
      high-follower-threshold: ${ENGAGEMENT_HIGH_FOLLOWER_THRESHOLD:10000}
      fanout-queue: ${ENGAGEMENT_FANOUT_QUEUE:engagement.feed.fanout}
  internal:
    studio-client-secret: ${ENGAGEMENT_STUDIO_INTERNAL_SECRET:}
    identity-client-secret: ${ENGAGEMENT_IDENTITY_INTERNAL_SECRET:}

services:
  studio:
    base-url: ${STUDIO_SERVICE_BASE_URL:http://novelforge-studio-service:8087}
  identity:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://novelforge-identity-service:8081}
  novel:
    base-url: ${NOVEL_SERVICE_BASE_URL:http://novelforge-novel-service:8083}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://novelforge-eureka-server:8761/eureka/}
    registry-fetch-interval-seconds: 15
  instance:
    hostname: ${RENDER_EXTERNAL_HOSTNAME:${RENDER_SERVICE_NAME:localhost}}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
