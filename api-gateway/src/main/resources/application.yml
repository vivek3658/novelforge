server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - AddRequestHeader=X-Gateway-Name, NovelForge-Gateway

        - id: novel-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/novels/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        # Expose all monitoring endpoints (* = all, or specify: health, info, metrics, gateway)
        include: "*"
  endpoint:
    health:
      show-details: always # Shows disk space, DB connections, and microservice status
    gateway:
      enabled: true        # Enables live gateway inspection and route reload