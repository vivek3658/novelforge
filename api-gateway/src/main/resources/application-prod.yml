server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  data:
    redis:
      url: ${REDIS_URL:}
      host: ${SPRING_DATA_REDIS_HOST:novelforge-redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
        pool:
          type: elastic
          max-connections: 50
          acquire-timeout: 5000

novelforge:
  gateway:
    internal-secret: ${GATEWAY_INTERNAL_SECRET:}
    trusted-proxy-hops: ${GATEWAY_TRUSTED_PROXY_HOPS:1}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://novelforge-eureka-server:8761/eureka/}
    registry-fetch-interval-seconds: 15
  instance:
    hostname: ${RENDER_EXTERNAL_HOSTNAME:${RENDER_SERVICE_NAME:localhost}}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    gateway:
      access: read-only

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web: WARN
    reactor.netty: WARN
