server:
  port: 8082
spring:
  application:
    name: notification-service
  mail:
    host: smtp.gmail.com
    port: 587
    username: REDACTED_EMAIL@example.com
    password: REDACTED_APP_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}