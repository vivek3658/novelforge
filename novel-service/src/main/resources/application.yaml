spring:
  application:
    name: novel-service
  datasource:
    url: jdbc:postgresql://localhost:5432/novelDB
    username: postgres
    password: REDACTED_DB_PASSWORD
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
server:
  port: 8083
#jwt:
#  secretKey: REDACTED_JWT_SECRET_KEY
novelforge:
  security:
    jwt:
      secret-key: REDACTED_JWT_SECRET_KEY
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}